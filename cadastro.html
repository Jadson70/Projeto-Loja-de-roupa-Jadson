<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Casual Style - Cadastro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Casual Style</h1>
    <nav>
      <a href="index.html">Início</a>
      <a href="catalogo.html">Catálogo</a>
      <a href="simulador.html">Simulador</a>
      <a href="cadastro.html">Cadastro</a>
      <a href="sobre.html">Sobre e dúvidas</a>
    </nav>
  </header>

  <main>
    <h2>Cadastro de cliente</h2>

    <form id="formulario" class="caixa" novalidate>
      <label for="nome">Nome completo:</label>
      <input type="text" id="nome" name="nome">
      <span class="erro" id="erro-nome"></span>

      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email">
      <span class="erro" id="erro-email"></span>

      <label for="telefone">Telefone (só números com DDD):</label>
      <input type="text" id="telefone" name="telefone">
      <span class="erro" id="erro-telefone"></span>

      <label for="cidade">Cidade:</label>
      <input type="text" id="cidade" name="cidade">
      <span class="erro" id="erro-cidade"></span>

      <label for="senha">Senha:</label>
      <input type="password" id="senha" name="senha">
      <span class="erro" id="erro-senha"></span>

      <button type="submit">Cadastrar</button>
      <p id="mensagem-final"></p>
    </form>
  </main>

  <footer>
    <p>Casual Style - Trabalho escolar</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
